<!DOCTYPE html>
<html lang="nl">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Animatie Test: Vloeiende Vormen</title>
    <link href="https://api.fontshare.com/v2/css?f[]=clash-grotesk@700&f[]=satoshi@700,500&display=swap" rel="stylesheet">
    <style>
        body {
            background-color: #5A4DE5; /* Grut paars */
            display: flex;
            justify-content: center;
            align-items: center;
            height: 100vh;
            margin: 0;
            font-family: 'Clash Grotesk', sans-serif;
            overflow: hidden;
        }

        .scene {
            position: relative;
            width: 100%;
            height: 72px; /* Nog iets krapper (precies de hoogte van de SVG) */
            display: flex;
            justify-content: center;
            align-items: center;
            margin-top: 0.25rem; /* Nog 25% dichterbij */
        }

        .absolute-center {
            position: absolute;
            top: 50%;
            left: 50%;
            transform: translate(-50%, -50%);
        }

        /* --- FASE 1: SMILE -> STRAIGHT RECTANGLE --- */
        .intro-wrapper {
            width: 144px; /* Aangepast naar proportie van de nieuwe dunne staaf (36px) */
            height: 72px;
            z-index: 10;
        }

        /* --- FASE 1B: NATIVE CSS SWAP & CHOREOGRAFIE --- */
        .intro-native {
            width: 240px; 
            height: 36px; /* Aangepast naar contact button hoogte */
            background-color: #F3C033;
            border-radius: 0px; /* Begint plat! */
            overflow: hidden; 
            z-index: 15;
            opacity: 0;
            pointer-events: none;
            /* Breedte, hoogte en border-radius met bounce! */
            transition: width 0.7s cubic-bezier(0.34, 1.3, 0.64, 1), 
                        height 0.7s cubic-bezier(0.34, 1.3, 0.64, 1),
                        border-radius 0.6s cubic-bezier(0.34, 1.4, 0.64, 1);
        }

        .scene.is-native .intro-wrapper {
            opacity: 0;
            transition: none; /* Instant hide SVG wrapper */
        }

        .scene.is-native .intro-native {
            opacity: 1; /* Instant show CSS wrapper */
        }

        .scene.is-radius-24 .intro-native {
            border-radius: 24px; /* Exact 24px in plaats van 999px voorkomt het "snappen" van de animatie */
        }

        .scene.hide-native .intro-native {
            opacity: 0;
            transition: none; /* Instant hide voor de knip */
        }

        /* Inschuivende tekst & Hover Carousel */
        .carousel-word {
            position: absolute;
            top: 50%;
            left: 50%;
            /* Start ver buiten de linkerkant van de button */
            transform: translate(calc(-50% - 150px), -50%); 
            color: #2E1E73;
            font-family: 'Clash Grotesk', sans-serif; /* Clash Grotesk in plaats van Satoshi */
            font-weight: 700; /* Dikste variant van Clash Grotesk (meestal Bold/700) */
            font-size: 18px;
            white-space: nowrap;
            opacity: 0;
            pointer-events: none;
            /* Snellere, kortere bounce easing op de slide-in/out */
            transition: transform 0.4s cubic-bezier(0.3, 1.4, 0.5, 1), opacity 0.25s ease;
        }

        /* Actieve staat: tekst gecentreerd in beeld */
        .carousel-word.is-center {
            transform: translate(-50%, -50%);
            opacity: 1;
        }

        /* Verlatende staat: tekst schuift naar rechts uit beeld */
        .carousel-word.is-right {
            transform: translate(calc(-50% + 150px), -50%);
            opacity: 0;
        }

        /* Handige class om de transitie uit te zetten wanneer we de tekst onzichtbaar terugzetten naar links */
        .carousel-word.no-transition {
            transition: none !important;
        }


        /* --- FASE 2 & 3: SPLIT BUTTONS --- */
        .buttons-container {
            display: flex;
            justify-content: center;
            align-items: center;
            gap: 0;
            width: max-content;
            z-index: 20;
            opacity: 0;
            pointer-events: none;
            transition: gap 0.6s cubic-bezier(0.34, 1.15, 0.64, 1);
        }

        .scene.is-cut-ready .buttons-container {
            opacity: 1;
            pointer-events: all;
        }

        .scene.is-cut .buttons-container {
            gap: 15px; /* De daadwerkelijke knip-afstand */
        }

        .split-btn {
            position: relative;
            height: 36px; /* Aangepast naar contact button hoogte */
            padding: 0 22px; /* Match met contact knop padding */
            font-family: inherit;
            background-color: #F3C033;
            border: none;
            cursor: pointer;
            outline: none;
            overflow: hidden; /* Verbergt tekst als deze buiten beeld staat */
            
            transform: scale(1); 
            transition: border-radius 0.6s cubic-bezier(0.34, 1.15, 0.64, 1);
        }

        /* Cut-ready state: Naadloos tegen elkaar aan */
        .left-btn { border-radius: 24px 0 0 24px; }
        .center-btn { border-radius: 0; }
        .right-btn { border-radius: 0 24px 24px 0; }

        /* Cut state: Geknipt! Rond af */
        .scene.is-cut .left-btn,
        .scene.is-cut .center-btn,
        .scene.is-cut .right-btn { 
            border-radius: 24px; 
        }

        @keyframes langzaamPuls {
            0% { transform: scale(1); }
            50% { transform: scale(1.1); }
            100% { transform: scale(1); }
        }

        .split-btn:hover {
            animation: langzaamPuls 1.5s infinite ease-in-out;
        }

        .split-btn__text {
            color: #2E1E73;
            font-family: 'Satoshi', sans-serif;
            font-weight: 500; /* Match met contact knop */
            font-size: 18px; /* Match met contact knop */
            display: flex;
            align-items: center;
            justify-content: center;
            height: 100%;
            width: 100%;
            opacity: 1; /* Geen fade meer */
            transform: translateX(-250px); /* Helemaal buiten links */
            transition: transform 0.4s cubic-bezier(0.3, 1.4, 0.5, 1); /* Exact zelfde snelle bounce als Hoe dan */
            pointer-events: none; /* Zorgt dat tekst de hover op button niet blokkeert */
        }

        .scene.is-text-visible .split-btn__text {
            transform: translateX(0); /* Schuift in naar het centrum */
        }

        .instructie {
            position: absolute;
            bottom: 40px;
            color: white;
            opacity: 0.5;
            font-weight: 500;
            letter-spacing: 0.02em;
            text-align: center;
            font-family: 'Satoshi', sans-serif;
        }

        /* --- MOBIELE WEERGAVE (Verticale Stack) --- */
        @media (max-width: 768px) {
            .buttons-container {
                flex-direction: column;
                align-items: stretch; /* Forceer gelijke breedte voor pilaar */
            }

            .left-btn { border-radius: 24px 24px 0 0; }
            .center-btn { border-radius: 0; }
            .right-btn { border-radius: 0 0 24px 24px; }

            .split-btn { padding: 0 16px; }
            .split-btn__text { font-size: 16px; }
        }

        /* --- FASE 4: OVERLAY --- */
        .test-overlay {
            position: fixed;
            top: 0;
            left: 0;
            width: 100vw;
            height: 100vh;
            background: rgba(10, 8, 30, 0.85); /* Donkere premium overlay */
            backdrop-filter: blur(20px);
            -webkit-backdrop-filter: blur(20px);
            z-index: 100;
            display: flex;
            justify-content: center;
            align-items: center;
            opacity: 0;
            pointer-events: none;
            transition: opacity 0.4s ease-out;
        }

        .test-overlay.is-active {
            opacity: 1;
            pointer-events: all;
        }

        .test-overlay__close {
            position: absolute;
            top: 2rem;
            right: 2rem;
            display: flex;
            flex-direction: column;
            gap: 5px;
            background: rgba(255, 255, 255, 0.1);
            border: 1px solid rgba(255, 255, 255, 0.2);
            cursor: pointer;
            width: 54px;
            height: 54px;
            border-radius: 50%;
            align-items: center;
            justify-content: center;
            padding: 0;
            z-index: 110;
            transition: background 0.3s ease-out, transform 0.3s cubic-bezier(0.34, 1.5, 0.64, 1);
        }

        .test-overlay__close:hover {
            background: rgba(255, 255, 255, 0.2);
            transform: scale(1.05);
        }

        .test-overlay__close span {
            width: 24px;
            height: 2px;
            background: #fff;
            border-radius: 2px;
            transition: all 0.3s ease-out;
        }

        /* Maak kruisje van de spans */
        .test-overlay__close.active span:nth-child(1) { transform: rotate(45deg) translate(5px, 5px); }
        .test-overlay__close.active span:nth-child(2) { opacity: 0; }
        .test-overlay__close.active span:nth-child(3) { transform: rotate(-45deg) translate(5px, -5px); }
        .test-overlay__close:hover span { background: #F3C033; /* Geel bij hover */ }
    </style>
</head>
<body>

    <div class="scene" id="scene">
        <!-- Fase 1: Intro SVG Shape (100% kogelvrije path morphing) -->
        <div class="intro-wrapper absolute-center" id="introWrapper">
            <svg viewBox="0 0 200 100" style="width: 100%; height: 100%; overflow: visible;">
                <path id="introPath" fill="#F3C033" d="M 0 0 C 0 0, 50 0, 50 0 C 50 28, 72 50, 100 50 C 128 50, 150 28, 150 0 C 150 0, 200 0, 200 0 C 200 27.5, 188.8 52.5, 170.6 70.6 C 152.5 88.8, 127.5 100, 100 100 C 72.5 100, 47.5 88.8, 29.4 70.6 C 11.3 52.5, 0 27.5, 0 0 Z" style="transition: d 0.7s cubic-bezier(0.34, 1.4, 0.64, 1);" />
            </svg>
        </div>
        
        <!-- Fase 1B: Native CSS Button (Choreografie) -->
        <div class="intro-native absolute-center" id="introNative">
            <!-- Carousel voor Hover effect -->
            <div class="carousel-word" id="word1">Hoe dan?</div>
            <div class="carousel-word" id="word2">Come?</div>
            <div class="carousel-word" id="word3">Wie?</div>
            <div class="carousel-word" id="word4">Que?</div>
        </div>

        <!-- Fase 3: The 3 Buttons -->
        <div class="buttons-container absolute-center" id="buttonsContainer">
            <button class="split-btn left-btn" id="btnLeft">
                <div class="split-btn__text">Onderzoek</div>
            </button>
            <button class="split-btn center-btn" id="btnCenter">
                <div class="split-btn__text">Advies</div>
            </button>
            <button class="split-btn right-btn" id="btnRight">
                <div class="split-btn__text">Techniek</div>
            </button>
        </div>
    </div>
    
    <div class="instructie" id="instructieText">De smile morphs...</div>

    <!-- Fase 4: Lege Overlay -->
    <div class="test-overlay" id="testOverlay">
        <button class="test-overlay__close active" id="overlayClose">
            <span></span>
            <span></span>
            <span></span>
        </button>
    </div>

    <script>
        const scene = document.getElementById('scene');
        const introWrapper = document.getElementById('introWrapper');
        const introNative = document.getElementById('introNative');
        const instructieText = document.getElementById('instructieText');
        const buttonsContainer = document.getElementById('buttonsContainer');
        
        // Carousel setup
        const words = document.querySelectorAll('.carousel-word');
        let currentWordIdx = 0;
        let isAnimatingCarousel = false;
        let carouselInterval = null; // Houdt het rouleren bij
        let pendingReset = false; // Onthoudt of we terug naar start moeten na de animatie

        // Functie om naar een specifiek woord te sliden
        function slideToWord(targetIdx) {
            if (currentWordIdx === targetIdx) return;
            isAnimatingCarousel = true;

            const oldWord = words[currentWordIdx];
            
            // Oude woord schuift naar rechts eruit met bounce
            oldWord.classList.remove('is-center');
            oldWord.classList.add('is-right');

            // Volgende woord voorbereiden
            currentWordIdx = targetIdx;
            const newWord = words[currentWordIdx];
            
            // Nieuwe woord komt van links naar het midden met bounce
            newWord.classList.add('is-center');

            // Cleanup nadat de snelle animatie klaar is (0.4s)
            setTimeout(() => {
                // Zet animatie uit op oude woord
                oldWord.classList.add('no-transition');
                // Haal hem van 'rechts' af, waardoor hij direct terug springt naar zijn 'links' startpositie
                oldWord.classList.remove('is-right');
                
                // Forceer de browser om deze positie zonder animatie te tekenen
                oldWord.getBoundingClientRect();
                
                // Zet animatie weer aan voor de volgende keer
                oldWord.classList.remove('no-transition');
                
                // Lock vrijgeven
                isAnimatingCarousel = false;

                // Als de muis in de tussentijd is weggehaald, schuif dan direct terug naar "Hoe dan?"
                if (pendingReset && currentWordIdx !== 0 && !carouselInterval) {
                    pendingReset = false;
                    slideToWord(0);
                }
            }, 400); // Aangepast naar 400ms (snellere bounce)
        }

        // Functie om simpelweg het volgende woord te kiezen
        function nextWord() {
            if (isAnimatingCarousel) return; // Voorkom overlappende animaties als je te snel hoovert
            slideToWord((currentWordIdx + 1) % words.length);
        }

        // Koppel het doorlopende hover effect
        introNative.addEventListener('mouseenter', () => {
            // Check of hij in een actieve, interactieve staat is en nog niet draait
            if (introNative.classList.contains('is-interactive')) {
                pendingReset = false; // Annuleer eventuele resets
                if (!carouselInterval) {
                    nextWord(); // Trigger de eerste direct!
                    carouselInterval = setInterval(nextWord, 1200); // Snellere cyclus (1.2s) passend bij snellere animatie
                }
            }
        });

        // Stop met rouleren als de muis weg is en ga terug naar start
        introNative.addEventListener('mouseleave', () => {
            clearInterval(carouselInterval);
            carouselInterval = null;
            
            if (currentWordIdx !== 0) {
                if (isAnimatingCarousel) {
                    pendingReset = true; // Wacht tot de animatie klaar is, ga dan terug
                } else {
                    slideToWord(0); // Ga direct terug
                }
            }
        });

        // Fase 1: De grote choreografie
        setTimeout(() => {
            // Morph the SVG path direct (betrouwbaarder dan CSS clip-path)
            document.getElementById('introPath').setAttribute('d', "M -66.7 50 C -66.7 37.5, -66.7 25, -66.7 25 C -66.7 25, 100 25, 100 25 C 100 25, 266.7 25, 266.7 25 C 266.7 25, 266.7 37.5, 266.7 50 C 266.7 62.5, 266.7 75, 266.7 75 C 266.7 75, 100 75, 100 75 C 100 75, -66.7 75, -66.7 75 C -66.7 75, -66.7 62.5, -66.7 50 Z");
            instructieText.innerText = "Boog wordt een platte staaf...";
            
            // Zodra plat (0.8s) -> Swap naar Native CSS box
            setTimeout(() => {
                scene.classList.add('is-native'); // Swap
                
                // FORCEER REFLOW! Dit fixt de border-radius snap-bug!
                introNative.getBoundingClientRect(); 

                // Vloeiende CSS transitie voor de border-radius!
                requestAnimationFrame(() => {
                    scene.classList.add('is-radius-24'); 
                    instructieText.innerText = "Vloeibare afronding...";
                });

                // Blijft even lang breed (1.0s pauze na de start van afronding)
                setTimeout(() => {
                    
                    // Bereken de strakke breedte van de tekst + padding
                    const textWidth = words[0].offsetWidth + 48; // 24px padding L+R
                    introNative.style.width = textWidth + 'px'; // Krimpt!
                    
                    instructieText.innerText = "Krimpt naar de button...";

                    // Tekst schuift in met kleine bounce, halve seconde later dan voorheen
                    setTimeout(() => {
                        // In plaats van scene class, triggeren we het eerste carousel woord!
                        words[0].classList.add('is-center');
                        instructieText.innerText = "Tekst schuift in! Hover over de button of klik.";
                        
                        // Na het inschuiven is de knop interactief voor de splitsing en hover
                        setTimeout(() => {
                            introNative.classList.add('is-interactive'); // Geeft hover vrij
                            introNative.style.pointerEvents = 'all'; /* Nu mag hij pas clicks ontvangen! */
                            introNative.style.cursor = 'pointer';
                            introNative.addEventListener('click', startFase2);
                        }, 800);

                    }, 700); /* Was 200ms, is nu 700ms (halve seconde later) */

                }, 1000);

            }, 700);

        }, 2000);

        // Fase 2: Stretching & Split (Na klik op introNative)
        function startFase2() {
            // Zet direct het hover rouleren helemaal uit
            clearInterval(carouselInterval);
            carouselInterval = null;
            introNative.classList.remove('is-interactive'); 
            introNative.removeEventListener('click', startFase2);
            
            // Verberg alle carousel teksten direct
            words.forEach(w => w.style.opacity = '0'); 
            
            instructieText.innerText = "Button rekt zich uit...";

            setTimeout(() => {
                // Rekt uit naar breedte/hoogte van de split buttons
                const isMobile = window.innerWidth <= 768;
                if (isMobile) {
                    introNative.style.height = buttonsContainer.offsetHeight + 'px';
                    introNative.style.width = buttonsContainer.offsetWidth + 'px';
                } else {
                    introNative.style.width = buttonsContainer.offsetWidth + 'px';
                }
                
                // Terwijl hij uitrekt, maken we hem vast perfect rond (Pill shape)
                // zodat hij naadloos matcht met de overlappende 3 split-buttons!
                introNative.style.borderRadius = '24px';

                // Als de stretch klaar is (na 0.8s) -> Knip in drieën!
                setTimeout(() => {
                    scene.classList.add('is-cut-ready'); // Swap naar 3 buttons
                    scene.classList.add('hide-native'); // Verberg intro-native
                    instructieText.innerText = "Geknipt in drieën!";

                    // FORCEER REFLOW! Zorgt dat de gap transitie niet snapt!
                    buttonsContainer.getBoundingClientRect();

                    requestAnimationFrame(() => {
                        // Schuif ze uit elkaar
                        scene.classList.add('is-cut');
                    });

                    // Zodra ze uit elkaar geschoven zijn -> Tekst verschijnt
                    setTimeout(() => {
                        scene.classList.add('is-text-visible');
                        instructieText.innerText = "Klaar! Hover over de buttons.";
                    }, 600);

                }, 800);

            }, 300);
        }

        // Overlay Logica
        const testOverlay = document.getElementById('testOverlay');
        const overlayClose = document.getElementById('overlayClose');

        function openOverlay() {
            testOverlay.classList.add('is-active');
        }

        function closeOverlay() {
            testOverlay.classList.remove('is-active');
        }

        // Koppel de clicks
        document.getElementById('btnLeft').addEventListener('click', openOverlay);
        document.getElementById('btnCenter').addEventListener('click', openOverlay);
        document.getElementById('btnRight').addEventListener('click', openOverlay);
        
        overlayClose.addEventListener('click', closeOverlay);
        
        // Sluit als je naast de inhoud klikt (momenteel overal)
        testOverlay.addEventListener('click', (e) => {
            if (e.target === testOverlay) {
                closeOverlay();
            }
        });
    </script>
</body>
</html>
