<!DOCTYPE html>
<html lang="nl">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Bubble Physics PoC - V5 (Pinch Cursor & Smooth Animation)</title>
    <script src="https://d3js.org/d3.v7.min.js"></script>
    <style>
        @font-face {
            font-family: "Clash Grotesk";
            src: url("assets/fonts/ClashGrotesk-400.woff2") format("woff2");
            font-weight: 400;
            font-display: swap;
        }
        @font-face {
            font-family: "Clash Grotesk";
            src: url("assets/fonts/ClashGrotesk-600.woff2") format("woff2");
            font-weight: 600;
            font-display: swap;
        }
        @font-face {
            font-family: "Satoshi";
            src: url("assets/fonts/Satoshi-400.woff2") format("woff2");
            font-weight: 400;
            font-display: swap;
        }
        @font-face {
            font-family: "Satoshi";
            src: url("assets/fonts/Satoshi-500.woff2") format("woff2");
            font-weight: 500;
            font-display: swap;
        }
        
        :root {
            --purple: #5A4DE5;
            --yellow: #F3C033;
            --dark: #0E0F0F;
            --white: #ffffff;
            --font-heading: 'Clash Grotesk', sans-serif;
            --font-body: 'Satoshi', sans-serif;
        }
        
        body {
            margin: 0;
            overflow: hidden;
            background: linear-gradient(135deg, #0f0a2a, #1a1640);
            font-family: var(--font-body);
            color: var(--white);
            height: 100vh;
        }
        
        #canvas-container {
            position: relative;
            width: 100vw;
            height: 100vh;
            z-index: 10;
        }

        .center-logo {
            position: fixed;
            top: 50%;
            left: 50%;
            transform: translate(-50%, -50%);
            width: 80px;
            height: 80px;
            border-radius: 50%;
            display: flex;
            align-items: center;
            justify-content: center;
            z-index: 20;
            box-shadow: 0 4px 30px rgba(243, 192, 51, 0.4);
            pointer-events: none;
        }
        .center-logo img {
            width: 100%;
            height: 100%;
        }

        /* --- GROTE CUSTOM NAALD CURSOR --- */
        #needle-cursor {
            position: fixed;
            top: 0;
            left: 0;
            width: 64px;
            height: 64px;
            pointer-events: none;
            z-index: 999999;
            opacity: 0;
            /* Lijn de punt van de naald (die op x=8, y=32 in de SVG zit) exact uit met de muis */
            transform: translate(-8px, -32px);
            transition: opacity 0.2s ease;
            display: flex;
            align-items: flex-start;
        }
        #needle-cursor svg {
            width: 64px;
            height: 64px;
        }
        
        /* Simpele horizontale prik-animatie voor de flat-design naald */
        @keyframes pokeNeedle {
            0% { transform: translateX(0); }
            50% { transform: translateX(-16px); } /* Glijdt naar voren */
            100% { transform: translateX(0); }
        }
        
        #needle-cursor.is-poking svg {
            animation: pokeNeedle 1.2s ease-in-out infinite;
        }

        /* Bubble Architecture */
        .bubble-wrapper {
            position: absolute;
            top: 0;
            left: 0;
            will-change: transform;
            z-index: 5;
            cursor: none !important; 
        }

        .bubble-content {
            position: absolute;
            top: 50%;
            left: 50%;
            transform: translate(-50%, -50%) scale(1);
            border-radius: 50%;
            display: flex;
            align-items: center;
            justify-content: center;
            text-align: center;
            cursor: none !important;
            background: radial-gradient(circle at 50% 50%, rgba(255, 255, 255, 0) 45%, rgba(160, 140, 255, 0.2) 80%, rgba(180, 160, 255, 0.5) 100%);
            backdrop-filter: blur(4px);
            -webkit-backdrop-filter: blur(4px);
            border: 1px solid rgba(180, 160, 255, 0.3);
            box-shadow: 
                inset 0 0 40px rgba(160, 140, 255, 0.6), /* Brede, zachte gloed naar binnen */
                inset 0 0 15px rgba(200, 180, 255, 0.4), /* Iets fellere rand aan de binnenkant */
                0 0 25px rgba(140, 120, 255, 0.3);       /* Subtiele gloed rondom de buitenkant */
            
            transition: transform 0.6s cubic-bezier(0.4, 0, 0.2, 1), 
                        box-shadow 0.6s ease, 
                        background 0.6s ease;
        }

        .bubble-wrapper:hover .bubble-content {
            transform: translate(-50%, -50%) scale(1.08);
            background: radial-gradient(circle at 50% 50%, rgba(255, 255, 255, 0) 40%, rgba(180, 160, 255, 0.25) 75%, rgba(200, 180, 255, 0.6) 100%);
            border-color: rgba(200, 180, 255, 0.45);
            box-shadow: 
                inset 0 0 50px rgba(180, 160, 255, 0.7),
                inset 0 0 20px rgba(220, 200, 255, 0.5),
                0 0 35px rgba(160, 140, 255, 0.4);
        }
        
        .bubble-gif-layer {
            position: absolute;
            inset: 0;
            border-radius: 50%;
            background-image: url('assets/Gif-rubiks.gif');
            background-size: cover;
            background-position: center;
            opacity: 0.2; 
            z-index: -1; /* Valt achter de tekst, maar in de bel */
            pointer-events: none;
            mix-blend-mode: screen; /* Zorgt dat het licht/organisch mengt met de donkere aarde */
        }
        
        .bubble-wrapper:hover {
            z-index: 6;
        }

        .bubble-content span {
            pointer-events: none;
            padding: 10px;
            font-family: var(--font-heading);
            font-size: 1.25rem;
            line-height: 1.1;
            font-weight: 400;
            letter-spacing: -0.02em;
        }

        .bottom-footer {
            position: fixed;
            bottom: 40px;
            left: 50%;
            transform: translateX(-50%);
            z-index: 100;
            display: flex;
            flex-direction: column;
            align-items: center;
            gap: 20px;
            text-align: center;
            width: 90%;
            max-width: 600px;
            pointer-events: none; /* Tekst is niet klikbaar */
        }

        .footer-text {
            font-family: var(--font-body);
            font-size: 1.15rem;
            color: #ffffff;
            font-weight: 400;
            line-height: 1.4;
            max-width: 480px;
            margin: 0 auto;
            text-wrap: balance;
        }

        .footer-buttons {
            display: flex;
            gap: 15px;
            opacity: 0;
            pointer-events: none;
            transition: opacity 0.5s var(--ease-spring, ease);
        }

        .footer-buttons.is-visible {
            opacity: 1;
            pointer-events: auto;
        }

        .btn {
            display: flex;
            align-items: center;
            justify-content: center;
            padding: 12px 32px;
            border-radius: 100px;
            font-family: var(--font-body);
            font-size: 1rem;
            font-weight: 600;
            cursor: pointer;
            transition: all 0.3s ease;
            outline: none;
            height: 48px;
            box-sizing: border-box;
        }

        .btn--ghost-light {
            border: 1px solid rgba(255,255,255,0.2);
            background: rgba(255,255,255,0.05);
            backdrop-filter: blur(12px);
            -webkit-backdrop-filter: blur(12px);
            color: #fff;
        }
        
        .btn--ghost-light:hover {
            background: rgba(255,255,255,0.15);
            border-color: rgba(255,255,255,0.3);
            transform: translateY(-2px);
        }

        .earth-bg {
            position: fixed;
            top: 0;
            left: 0;
            width: 100vw;
            height: 100vh;
            background-image: url('assets/Aarde1.jpg');
            background-size: cover;
            background-position: center;
            background-repeat: no-repeat;
            z-index: 1;
            pointer-events: none;
        }
        .hover-preview-container {
            position: absolute;
            inset: 0;
            border-radius: 50%;
            overflow: hidden;
            pointer-events: none;
            z-index: 0; /* Valt achter de hoofdtekst (die een default z-index heeft) */
            opacity: 0;
            transition: opacity 0.6s ease;
        }

        .bubble-wrapper:hover {
            z-index: 6;
        }

    </style>
</head>
<body>

    <!-- Tijdelijke visuele referentie van de navigatie -->
    <div style="position: fixed; top: 1.25rem; left: 50%; transform: translateX(-50%); z-index: 1000; display: flex; align-items: center; background: rgba(10,8,30,0.35); backdrop-filter: blur(20px); -webkit-backdrop-filter: blur(20px); border: 1px solid rgba(255,255,255,0.1); border-radius: 100px; padding: 8px 8px 8px 20px; box-shadow: 0 8px 32px rgba(0,0,0,0.2); gap: 28px; pointer-events: none;">
        <div style="color: #F3C033; font-weight: 700; font-family: 'Clash Grotesk', sans-serif; font-size: 24px; letter-spacing: 1px;">Grut</div>
        <div style="display: flex; gap: 20px; font-family: 'Satoshi', sans-serif; font-size: 18px; font-weight: 500; color: rgba(255,255,255,0.75);">
            <span>Over ons</span>
            <span>Diensten</span>
            <span>Portfolio</span>
            <span>Team</span>
        </div>
        <div style="background: #F3C033; color: #1a1640; padding: 5px 22px; border-radius: 100px; font-family: 'Satoshi', sans-serif; font-weight: 600;">Contact</div>
    </div>

    <!-- Geanimeerde Custom Cursor (Enkel een gele naald) -->
    <div id="needle-cursor">
        <svg viewBox="0 0 64 64" xmlns="http://www.w3.org/2000/svg">
            <!-- Subtiele schaduw zodat de naald goed loskomt van de bellen -->
            <g filter="drop-shadow(0px 2px 4px rgba(0,0,0,0.5))">
                <circle cx="50" cy="32" r="3" fill="var(--yellow)" />
                <!-- De scherpe, slanke naald (aangesloten op het rondje) -->
                <polygon points="8,32 47,31 47,33" fill="var(--yellow)" />
            </g>
        </svg>
    </div>

    <div class="earth-bg"></div>

    <div class="center-logo">
        <img src="assets/Grut-beeldmerk.svg" alt="Grut Logo">
    </div>

    <div id="canvas-container"></div>
    
    <div class="bottom-footer">
        <div class="footer-text">Door UX design, usertests en advies slaan wij een brug tussen ambities en klantervaring.</div>
        <div class="footer-buttons" id="footerButtons">
            <button id="resetBtn" class="btn btn--ghost-light">Reset animatie</button>
        </div>
    </div>

    <script>
        // Custom Cursor Logic
        const customCursor = document.getElementById('needle-cursor');
        let isHoveringBubble = false;

        document.addEventListener('mousemove', (e) => {
            if (isHoveringBubble) {
                customCursor.style.left = e.clientX + 'px';
                customCursor.style.top = e.clientY + 'px';
            }
        });

        const container = document.getElementById('canvas-container');
        let width = window.innerWidth;
        let height = window.innerHeight;
        let simulation;
        let nodes = [];
        // De complete "database" van bellen.
        const allBubbles = [
            // LEVEL 1 (Beginscherm)
            { id: 'ambities', parentId: null, level: 1, radiusDesktop: 240, radiusMobile: 140, label: 'Digitale\nambities\nvan een\nbedrijf' },
            { id: 'ervaring', parentId: null, level: 1, radiusDesktop: 240, radiusMobile: 140, label: 'Optimale\nervaring\nvoor de\nklant' },
            
            // --- TAK 1: Digitale ambities --- //
            // LEVEL 2
            { id: 'website', parentId: 'ambities', level: 2, radiusDesktop: 120, radiusMobile: 80, label: 'Website' },
            { id: 'marketing', parentId: 'ambities', level: 2, radiusDesktop: 120, radiusMobile: 80, label: 'Marketing\nkanalen' },
            { id: 'service', parentId: 'ambities', level: 2, radiusDesktop: 120, radiusMobile: 80, label: 'Service &\nsupport' },
            { id: 'sales', parentId: 'ambities', level: 2, radiusDesktop: 80, radiusMobile: 50, label: 'Sales tools' },
            
            // LEVEL 3 (Onder Website)
            { id: 'content', parentId: 'website', level: 3, radiusDesktop: 80, radiusMobile: 50, label: 'Content' },
            { id: 'techniek', parentId: 'website', level: 3, radiusDesktop: 80, radiusMobile: 50, label: 'Techniek' },
            { id: 'data', parentId: 'website', level: 3, radiusDesktop: 60, radiusMobile: 40, label: 'Data' },
            
            // LEVEL 4 (Onder Content)
            { id: 'fotografie', parentId: 'content', level: 4, radiusDesktop: 60, radiusMobile: 40, label: 'Fotografie' },
            { id: 'copy', parentId: 'content', level: 4, radiusDesktop: 60, radiusMobile: 40, label: 'Copywriting' },
            
            // LEVEL 4 (Onder Techniek)
            { id: 'frontend', parentId: 'techniek', level: 4, radiusDesktop: 60, radiusMobile: 40, label: 'Front-end' },
            { id: 'cms', parentId: 'techniek', level: 4, radiusDesktop: 60, radiusMobile: 40, label: 'Content\nmanagement\nsystemen' },
            { id: 'backend', parentId: 'techniek', level: 4, radiusDesktop: 60, radiusMobile: 40, label: 'Back-end' },
            { id: 'genai', parentId: 'techniek', level: 4, radiusDesktop: 60, radiusMobile: 40, label: 'Generative\nAI' },
            
            // LEVEL 3 (Onder Marketing kanalen)
            { id: 'social', parentId: 'marketing', level: 3, radiusDesktop: 80, radiusMobile: 50, label: 'Social\nmedia' },
            { id: 'ads', parentId: 'marketing', level: 3, radiusDesktop: 80, radiusMobile: 50, label: 'Advertenties' },
            
            // LEVEL 3 (Onder Service & support)
            { id: 'auto_service', parentId: 'service', level: 3, radiusDesktop: 80, radiusMobile: 50, label: 'Automatisering' },
            { id: 'crm', parentId: 'service', level: 3, radiusDesktop: 80, radiusMobile: 50, label: 'CRM' },
            
            // LEVEL 3 (Onder Sales tools)
            { id: 'presentaties', parentId: 'sales', level: 3, radiusDesktop: 60, radiusMobile: 40, label: 'Presentaties' },
            { id: 'marketing_auto', parentId: 'sales', level: 3, radiusDesktop: 80, radiusMobile: 50, label: 'Marketing\nautomation' },
            { id: 'offerte', parentId: 'sales', level: 3, radiusDesktop: 80, radiusMobile: 50, label: 'Offerte\ngeneratie' },
            
            // --- TAK 2: Optimale ervaring --- //
            // LEVEL 2
            { id: 'veiligheid', parentId: 'ervaring', level: 2, radiusDesktop: 120, radiusMobile: 80, label: 'Veiligheid &\ntoegankelijkheid' },
            { id: 'automatisering_opt', parentId: 'ervaring', level: 2, radiusDesktop: 120, radiusMobile: 80, label: 'Automatisering' },
            { id: 'wetgeving', parentId: 'ervaring', level: 2, radiusDesktop: 120, radiusMobile: 80, label: 'Kaders &\nwetgeving' },
            { id: 'doelen', parentId: 'ervaring', level: 2, radiusDesktop: 120, radiusMobile: 80, label: 'Sales\ndoelen' },
            
            // LEVEL 3 (Onder Veiligheid)
            { id: 'wcag', parentId: 'veiligheid', level: 3, radiusDesktop: 80, radiusMobile: 50, label: 'WCAG &\ntoegankelijkheid' },
            { id: 'datamanagement', parentId: 'veiligheid', level: 3, radiusDesktop: 80, radiusMobile: 50, label: 'Datamanagement' },
            { id: 'veiligheid_2', parentId: 'veiligheid', level: 3, radiusDesktop: 60, radiusMobile: 40, label: 'Veiligheid' },
            
            // LEVEL 3 (Onder Automatisering)
            { id: 'trends', parentId: 'automatisering_opt', level: 3, radiusDesktop: 80, radiusMobile: 50, label: 'Trends in\nbranche' },
            { id: 'ai_impl', parentId: 'automatisering_opt', level: 3, radiusDesktop: 80, radiusMobile: 50, label: 'AI\nimplementatie' },
            { id: 'journeys', parentId: 'automatisering_opt', level: 3, radiusDesktop: 80, radiusMobile: 50, label: 'Customer\njourneys' },
            
            // LEVEL 3 (Onder Kaders & wetgeving)
            { id: 'software_arch', parentId: 'wetgeving', level: 3, radiusDesktop: 80, radiusMobile: 50, label: 'Software\narchitectuur' },
            { id: 'avg', parentId: 'wetgeving', level: 3, radiusDesktop: 60, radiusMobile: 40, label: 'AVG' },
            { id: 'gdpr', parentId: 'wetgeving', level: 3, radiusDesktop: 60, radiusMobile: 40, label: 'GDPR' },
            
            // LEVEL 3 (Onder Sales doelen)
            { id: 'lead_gen', parentId: 'doelen', level: 3, radiusDesktop: 80, radiusMobile: 50, label: 'Lead\ngeneratie' },
            { id: 'advertising', parentId: 'doelen', level: 3, radiusDesktop: 60, radiusMobile: 40, label: 'Advertising' },
            { id: 'seo', parentId: 'doelen', level: 3, radiusDesktop: 80, radiusMobile: 50, label: 'SEO & SEA' }
        ];

        function getRadius(nodeData) {
            return window.innerWidth > 768 ? nodeData.radiusDesktop : nodeData.radiusMobile;
        }

        function forceLogoCollision(alpha) {
            const logoRadius = 60; // Fysieke radius is iets groter dan het visuele logo (80px dia) voor een mooie marge
            const centerX = width / 2;
            const centerY = height / 2;

            for (let i = 0, n = nodes.length; i < n; ++i) {
                const node = nodes[i];
                // Beginscherm: level 1 bellen negeren het logo voor de Venn overlap
                // Zodra gepopt (nodes.length > 2), weert het logo ALLES af
                if (node.level === 1 && nodes.length === 2) continue; 

                const dx = node.x - centerX;
                const dy = node.y - centerY;
                const distance = Math.sqrt(dx * dx + dy * dy);
                const minDistance = logoRadius + node.radius;

                if (distance < minDistance) {
                    // Zeer krachtige afstoting (2.5) om overlappen te voorkomen
                    const pushFactor = (minDistance - distance) / distance * alpha * 2.5;
                    node.vx += dx * pushFactor;
                    node.vy += dy * pushFactor;
                }
            }
        }

        function initSimulation() {
            container.innerHTML = '';
            
            // Zoek alle root nodes (parentId is null) uit de allBubbles array
            const rootNodes = allBubbles.filter(b => b.parentId === null);
            
            nodes = rootNodes.map(b => ({
                id: b.id,
                level: b.level,
                label: b.label,
                baseRadius: getRadius(b),
                radius: getRadius(b),
                x: b.id === 'ambities' ? (width/2 - 250) : (width/2 + 250),
                y: height/2
            }));
            
            simulation = d3.forceSimulation(nodes)
                .force('x', d3.forceX(d => {
                    // Venn diagram: Trek alleen uit elkaar als het beginscherm actief is (2 bellen)
                    if (nodes.length === 2) {
                        if (d.id === 'ambities') return (width / 2) - (d.radius * 0.65);
                        if (d.id === 'ervaring') return (width / 2) + (d.radius * 0.65);
                    }
                    return width / 2;
                }).strength(d => nodes.length === 2 ? 0.03 : 0.015))
                .force('y', d3.forceY(height / 2).strength(d => nodes.length === 2 ? 0.03 : 0.015))
                .force('collide', d3.forceCollide().radius(d => nodes.length === 2 ? d.radius * 0.5 : d.radius + 10).iterations(8).strength(1))
                .force('charge', d3.forceManyBody().strength(d => nodes.length === 2 ? -20 : -60))
                .force('logo', forceLogoCollision)
                .on('tick', ticked);

            renderNodes();
        }

        function renderNodes() {
            const nodeElements = d3.select('#canvas-container')
                .selectAll('.bubble-wrapper')
                .data(nodes, d => d.id);

            const nodeEnter = nodeElements.enter()
                .append('div')
                .attr('class', 'bubble-wrapper')
                .style('width', '0px')
                .style('height', '0px')
                .on('click', handleBubbleClick)
                .on('mouseenter', handleHover)
                .on('mouseleave', handleHoverOut)
                .call(d3.drag() 
                    .on('start', dragstarted)
                    .on('drag', dragged)
                    .on('end', dragended)
                );

            const contentEnter = nodeEnter.append('div')
                .attr('class', 'bubble-content')
                .style('width', d => `${d.radius * 2}px`)
                .style('height', d => `${d.radius * 2}px`);

            contentEnter.append('span')
                .style('font-size', d => {
                    const isDesktop = window.innerWidth > 768;
                    if (d.level === 1) return isDesktop ? '2rem' : '1.25rem';
                    if (d.level === 2) return isDesktop ? '1.3rem' : '0.9rem';
                    
                    // Level 3 en 4
                    if (d.radius <= 60) return isDesktop ? '0.9rem' : '0.75rem'; // Zeer kleine tekst voor de allerkleinste bellen
                    return isDesktop ? '1.05rem' : '0.85rem';
                })
                .html(d => d.label.replace(/\n/g, '<br>'));

            nodeElements.exit()
                .style('opacity', 0)
                .style('pointer-events', 'none')
                .select('.bubble-content')
                .style('transform', 'translate(-50%, -50%) scale(0.5)')
                .transition().duration(400)
                .remove();
        }

        function ticked() {
            d3.selectAll('.bubble-wrapper')
                .style('transform', d => `translate3d(${d.x}px, ${d.y}px, 0)`);
                
            nodes.forEach(node => {
                node.vx += (Math.random() - 0.5) * 0.08;
                node.vy += (Math.random() - 0.5) * 0.08;
                
                const margin = node.radius + 20;
                if (node.x < margin) node.vx += 0.3;
                if (node.x > width - margin) node.vx -= 0.3;
                if (node.y < margin) node.vy += 0.3;
                if (node.y > height - margin) node.vy -= 0.3;
            });
        }

        function handleHover(event, d) {
            isHoveringBubble = true;
            customCursor.style.opacity = 1;
            customCursor.style.left = event.clientX + 'px';
            customCursor.style.top = event.clientY + 'px';
            customCursor.classList.add('is-poking');
            
            // Fysiek vergroten in de D3 engine, zodat hij anderen wegduwt
            d.radius = d.baseRadius * 1.08;
            simulation.force('collide').radius(n => nodes.length === 2 ? n.radius * 0.5 : n.radius + 10);
            simulation.alpha(0.3).restart(); // Maak de engine een beetje wakker voor een soepele duw
        }

        function handleHoverOut(event, d) {
            isHoveringBubble = false;
            customCursor.style.opacity = 0;
            customCursor.classList.remove('is-poking');
            
            // Herstel de physics radius als de muis de bel verlaat
            d.radius = d.baseRadius;
            simulation.force('collide').radius(n => nodes.length === 2 ? n.radius * 0.5 : n.radius + 10);
            simulation.alpha(0.3).restart();
        }

        function handleBubbleClick(event, d) {
            // Zoek direct in de allBubbles array naar specifieke kinderen
            const childrenData = allBubbles.filter(b => b.parentId === d.id);

            if (childrenData.length > 0) {
                // Toon de reset knop zodra er minimaal 1 bel gepopt is
                document.getElementById('footerButtons').classList.add('is-visible');

                nodes = nodes.filter(n => n.id !== d.id);
                
                const children = childrenData.map(child => {
                    const r = getRadius(child);
                    return {
                        id: child.id,
                        level: child.level,
                        label: child.label,
                        baseRadius: r,
                        radius: r,
                        x: d.x + (Math.random() - 0.5) * 20, 
                        y: d.y + (Math.random() - 0.5) * 20,
                        vx: (Math.random() - 0.5) * 8,
                        vy: (Math.random() - 0.5) * 8
                    };
                });

                nodes.push(...children);
                
                // Belangrijk: update de physics krachten nu we niet meer in beginscherm (nodes == 2) zijn!
                simulation.force('collide').radius(d => d.radius + 10);
                simulation.force('x', d3.forceX(width / 2).strength(0.015));
                simulation.force('y', d3.forceY(height / 2).strength(0.015));
                simulation.force('charge', d3.forceManyBody().strength(-60));
                
                simulation.nodes(nodes);
                simulation.alpha(1).restart();
                renderNodes();
                
                isHoveringBubble = false;
                customCursor.style.opacity = 0;
                customCursor.classList.remove('is-poking');
            } else {
                const content = d3.select(this).select('.bubble-content');
                content
                    .style('transform', 'translate(-50%, -50%) scale(0.95)')
                    .transition().duration(400)
                    .style('transform', 'translate(-50%, -50%) scale(1.08)');
            }
        }

        function dragstarted(event, d) {
            if (!event.active) simulation.alphaTarget(0.3).restart();
            d.fx = d.x;
            d.fy = d.y;
        }

        function dragged(event, d) {
            d.fx = event.x;
            d.fy = event.y;
            
            if(isHoveringBubble) {
                customCursor.style.left = event.sourceEvent.clientX + 'px';
                customCursor.style.top = event.sourceEvent.clientY + 'px';
            }
        }

        function dragended(event, d) {
            if (!event.active) simulation.alphaTarget(0);
            d.fx = null;
            d.fy = null;
        }

        document.getElementById('resetBtn').addEventListener('click', () => {
            document.getElementById('footerButtons').classList.remove('is-visible');
            initSimulation();
        });
        initSimulation();

        window.addEventListener('resize', () => {
            width = window.innerWidth;
            height = window.innerHeight;
            simulation.force('x', d3.forceX(d => {
                    if (nodes.length === 2) {
                        if (d.id === 'ambities') return (width / 2) - (d.radius * 0.65);
                        if (d.id === 'ervaring') return (width / 2) + (d.radius * 0.65);
                    }
                    return width / 2;
                }).strength(nodes.length === 2 ? 0.03 : 0.015))
                .force('y', d3.forceY(height / 2).strength(nodes.length === 2 ? 0.03 : 0.015));
        });
    </script>
</body>
</html>
